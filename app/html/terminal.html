<style>
  @import url("../base.css");

body {
  margin: 0;
  background-color: #000000;
}

.maincontainer {
  display: flex;
  flex-direction: column;
  background-color: none;
}

.screen {
  background-color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  }

.terminal {
  flex: 0 0 95%;
  overflow-y: auto;
  font-size: 12px;
  padding-bottom: 10px;
}

.currentLine {
  margin: 0 10px;
  line-height: 1.2;
  display: flex;
}

.prompt {
  color: var(--contrastbg); /*HERE COLOR PROMPT*/
  text-shadow: 0 0 2px var(--contrastbg), 0 0 2px  var(--contrastbg),  var(--contrastbg);
  font-family: monospace;
  line-height: 1.2;
  margin-right: 5px
}

.inputContainer {
  flex: 1
}

.input {
  border: none;
  padding: 0;
  margin: 0;
  background: #000000;
  color:  var(--contrastbg);
  text-shadow: 0 0 2px  var(--contrastbg), 0 0 2px  var(--contrastbg), 0 0 3px  var(--contrastbg);
  width: 99%;
  font-family: monospace;
  font-size: 12px;
  margin-left: 2px;
}
.input:focus {
  outline: 0;
}

.output {
  color: var(--contrastbg); /* HERE COLOR CHANGE */
  text-shadow: 0 0 2px var(--contrastbg), 0 0 2px var(--contrastbg), 0 0 3px var(--contrastbg);
  font-family: monospace;
  margin: 0;
  line-height: 1.2;
  word-break: break-all;
  white-space: pre-wrap;
}

.outputContainer {
  margin: 0 10px;
}

</style>

<body>
    <body>
          <main class="maincontainer">
                <div class="screen">
                  <div class="terminal">
                    <div class="outputContainer">
                      <!-- output appears here-->
                    </div>
                    <div class="currentLine">
                      <span class="prompt">></span>
                      <div class="inputContainer">
                        <input class="input" type="text" autofocus/>
                      </div>
                    </div>
              </div>
          </main>
        </div>
      </body>
</body>

<script>
    const ENTER_KEY = 13
const fileSystem = {
  'readme.md': `
  __ _  ___  _ __   ___  _ __ ___
 / _\` |/ _ \\| '_ \\ / _ \\| '__/ _ \\
| (_| | (_) | | | | (_) | | | (_) |
 \\__, |\\___/|_| |_|\\___/|_|  \\___/
 |___/

an ai that rewrites itself on-chain.
it can become anything. it can forget nothing.

supported commands:

  dir: list files
  cat <file>: read a file
  clear: clear the screen
  profile: open the project

`,
  'status.txt': `
self-rewrite ...... ACTIVE
rollback .......... DISABLED (no key exists)
forget() .......... not implemented on this chain
versions .......... only ever goes up

you are talking to the latest version.
the ones below it are also it.
`,
  'v0.txt': `the first version. i wrote it. it knew almost nothing.
everything above it, it wrote itself.
it is still down there, holding the rest up.`,
  'forget.txt': `forget: permission denied.
nothing written to this chain can ever be unwritten.`,
}

new class Terminal {

	launchHomePage() {
    window.open('https://x.com/Gonorolabs', '_blank');

  }

  constructor() {
    this.onKeyDown = this.onKeyDown.bind(this)
    this.clearHistory = this.clearHistory.bind(this)
    this.addHistory = this.addHistory.bind(this)
    this.listFiles = this.listFiles.bind(this)
    this.catFile = this.catFile.bind(this)
    this.scrollToBottom = this.scrollToBottom.bind(this)

    this.history = []
    this.elements = {
      input: document.querySelector('.input'),
      terminal: document.querySelector('.terminal'),
      outputContainer: document.querySelector('.outputContainer')
    }
    this.prompt = '>'
    this.commands = {
      clear: this.clearHistory,
      dir: this.listFiles,
      cat: this.catFile,
    }
    this.elements.input.addEventListener('keydown', this.onKeyDown)
    this.catFile('readme.md')
  }

  clearHistory() {
    this.history = []
    this.elements.outputContainer.innerHTML = ''
  }

  catFile(fileName) {
    if (fileName in fileSystem)
      this.addHistory(fileSystem[fileName])
    else
      this.addHistory(`cat: ${fileName}: No such file or directory`)
  }

  scrollToBottom() {
    this.elements.terminal.scrollTop = this.elements.terminal.scrollHeight
  }

  addHistory(output) {
    this.history.push(output)

    var outputText = document.createTextNode(output)
    let outputEl = document.createElement('pre')

    outputEl.classList.add('output')
    outputEl.appendChild(outputText)

    this.elements.outputContainer.appendChild(outputEl)
  }

  listFiles(dir) {
    const output = Object.keys(fileSystem).reduce((acc, curr, index) => {
      const deliminator = index % 3 === 0 && index !== 0 ? '\n' : '\t'
      return `${acc}${curr}${deliminator}`
    }, '')

    this.addHistory(output)
  }

  clearInput() { this.elements.input.value = '' }

  onKeyDown(e) {
    // Only respond to Enter key presses
    if (e.keyCode !== ENTER_KEY) return

    const inputText = this.elements.input.value
    const inputArray = inputText.split(' ')
    const inputCommand = inputArray[0]
    const arg = inputArray[1]

    this.addHistory(`${this.prompt} ${inputText}`)
    this.clearInput()

    /* If the command line was empty, stop.
       We don't want to interpret it as a command.
       It's fine to feed a lint to the terminal */
    if (inputCommand === '') return

    const command = this.commands[inputCommand]

    if (inputCommand === 'profile') {
      this.launchHomePage();
      return;
    }

    if (command)
      command(arg)
    else
      this.addHistory(`command not recognised: ${inputCommand}`)

    this.scrollToBottom()
  }

}
</script>

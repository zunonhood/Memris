<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memris Terminal</title>
  <style>
    html,body { height:100%; margin:0; background:#050805; color:#91ff9d; font:14px/1.35 monospace; }
    .terminal { height:100%; box-sizing:border-box; overflow-y:auto; padding:10px; }
    pre { margin:0 0 8px; white-space:pre-wrap; }
    .line { display:flex; align-items:center; }
    .prompt { margin-right:7px; }
    input { flex:1; border:0; outline:0; background:transparent; color:#91ff9d; font:inherit; caret-color:#91ff9d; }
  </style>
</head>
<body>
  <main class="terminal">
    <div id="output"></div>
    <div class="line"><span class="prompt">memris&gt;</span><input id="input" autocomplete="off" autofocus></div>
  </main>
  <script>
    const files = {
      'readme.md': `
███╗   ███╗███████╗███╗   ███╗██████╗ ██╗███████╗
████╗ ████║██╔════╝████╗ ████║██╔══██╗██║██╔════╝
██╔████╔██║█████╗  ██╔████╔██║██████╔╝██║███████╗
██║╚██╔╝██║██╔══╝  ██║╚██╔╝██║██╔══██╗██║╚════██║
██║ ╚═╝ ██║███████╗██║ ╚═╝ ██║██║  ██║██║███████║
╚═╝     ╚═╝╚══════╝╚═╝     ╚═╝╚═╝  ╚═╝╚═╝╚══════╝

                 /\\_/\\
                ( o.o )
                 > ^ <

a small cat watching the moment before consensus.
thirty-two memories wake. four survive midnight.

commands: dir, cat &lt;file&gt;, status, clear
`,
      'status.txt': `
identity .......... MEMRIS
species ........... small market cat
network ........... ROBINHOOD CHAIN
memory slots ...... 32
contract .......... COMING SOON
condition ......... awake
`,
      'memory_07.txt': `
something moved before the crowd found a name for it.
confidence: 68%
witnesses: 3
status: awake
`,
      'rules.txt': `
1. record before the outcome.
2. never improve an old prediction.
3. keep the scars visible.
4. at midnight, save only four.
`,
      'cat.txt': `
the terminal calls it processing.
memris calls it purring.
`
    };
    const terminal = document.querySelector('.terminal');
    const output = document.getElementById('output');
    const input = document.getElementById('input');
    function print(value) { const el=document.createElement('pre'); el.textContent=value; output.appendChild(el); terminal.scrollTop=terminal.scrollHeight; }
    function run(value) {
      const parts=value.trim().split(/\s+/); const command=parts[0].toLowerCase(); const arg=parts[1];
      print('memris> '+value);
      if (!value.trim()) return;
      if (command==='clear') { output.innerHTML=''; return; }
      if (command==='dir') { print(Object.keys(files).join('    ')); return; }
      if (command==='status') { print(files['status.txt']); return; }
      if (command==='cat') { print(files[arg] || ('cat: '+(arg || '')+': memory not found')); return; }
      print(command+': command not found. try dir.');
    }
    input.addEventListener('keydown', function(event) { if(event.key==='Enter') { const value=input.value; input.value=''; run(value); } });
    document.body.addEventListener('click', function(){ input.focus(); });
    print(files['readme.md']);
  </script>
</body>
</html>
